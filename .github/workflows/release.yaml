name: Docker Dev Images Release

# Manual only: pushing a git tag no longer publishes images.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the selected branch or tag name)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  call-docker-build:
    uses: ./.github/workflows/docker-build-workflow.yaml
    # The mirror step reads LEGACY_GHCR_TOKEN, and a called workflow gets no
    # secrets unless they are passed.
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.ref_name }}
