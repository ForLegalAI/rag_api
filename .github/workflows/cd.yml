name: CD

# Builds and publishes the lite image to GHCR. Manual only: Actions → CD → Run workflow,
# pick the branch or tag to build. The image is always tagged with the commit SHA, plus
# the `tag` input (default `latest`; use e.g. `v1.2.0` for a release).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish in addition to the commit SHA'
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-lite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase, and the repository owner is not guaranteed to be.
      - name: Resolve image name
        run: printf 'GHCR_IMAGE=ghcr.io/%s/librechat-rag-api-dev-lite\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.lite
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:${{ inputs.tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
